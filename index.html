<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>How deep is your Silenzio?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0A0A0A;
    font-family: 'Cormorant Garamond', serif;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
    transition: transform 0.05s linear;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 10, 0.95);
    z-index: 100;
    transition: opacity 2s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .overlay h1 {
    color: #E8E3D8;
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.3em;
    margin-bottom: 2rem;
    text-align: center;
  }

  .overlay p {
    color: rgba(232, 227, 216, 0.6);
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    margin-bottom: 3rem;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }

  button {
    background: transparent;
    border: 1px solid rgba(232, 227, 216, 0.4);
    color: #E8E3D8;
    padding: 1rem 3rem;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 1s ease;
    font-family: inherit;
  }

  button:hover {
    border-color: rgba(232, 227, 216, 0.8);
    background: rgba(232, 227, 216, 0.05);
  }

  .status {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(232, 227, 216, 0.4);
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    z-index: 50;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .status.visible {
    opacity: 1;
  }

  .noise-level {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 2px;
    background: rgba(232, 227, 216, 0.15);
    z-index: 50;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(232, 227, 216, 0.1);
  }

  .noise-level .bar {
    height: 100%;
    background: linear-gradient(90deg, 
      rgba(232, 227, 216, 0.3) 0%, 
      rgba(232, 227, 216, 0.6) 50%,
      rgba(255, 50, 50, 0.9) 100%);
    width: 0%;
    transition: width 0.1s ease;
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(232, 227, 216, 0.4);
  }

  .noise-label {
    position: fixed;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(232, 227, 216, 0.3);
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    z-index: 50;
    text-transform: uppercase;
  }

  .glitch-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8rem;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.03);
    letter-spacing: 0.1em;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }

  .glitch-overlay.active {
    opacity: 1;
    animation: glitch-anim 0.2s infinite;
  }

  @keyframes glitch-anim {
    0% { transform: translate(-50%, -50%) skew(0deg); }
    20% { transform: translate(-52%, -48%) skew(-2deg); }
    40% { transform: translate(-48%, -52%) skew(2deg); }
    60% { transform: translate(-51%, -49%) skew(-1deg); }
    80% { transform: translate(-49%, -51%) skew(1deg); }
    100% { transform: translate(-50%, -50%) skew(0deg); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="glitch-overlay" id="glitchOverlay">RUMORE</div>

<div class="overlay" id="overlay">
  <h1>SILENZIO</h1>
  <p>Questa opera richiede il tuo silenzio.<br>Il rumore distrugge la visione.<br>Il silenzio la rivela.</p>
  <button id="startBtn">ENTRA NEL SILENZIO</button>
</div>

<div class="status" id="status">in ascolto...</div>

<div class="noise-label">rumore</div>
<div class="noise-level">
  <div class="bar" id="noiseBar"></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const noiseBar = document.getElementById('noiseBar');
const glitchOverlay = document.getElementById('glitchOverlay');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let audioContext;
let analyser;
let dataArray;
let isListening = false;

let noiseLevel = 0;
let smoothNoise = 0;
let particles = [];
let revealed = false;

const THRESHOLD = 30;
const SILENCE_TIME = 2000;
let silenceStartTime = null;

class ChaosParticle {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 15;
    this.vy = (Math.random() - 0.5) * 15;
    this.size = Math.random() * 4 + 1;
    this.life = Math.random();
  }

  update(intensity) {
    this.x += this.vx * intensity * (1 + intensity * 2);
    this.y += this.vy * intensity * (1 + intensity * 2);
    this.life -= 0.02 * intensity;

    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H || this.life <= 0) {
      this.reset();
      if (intensity > 0.6) {
        this.x = W / 2 + (Math.random() - 0.5) * 100;
        this.y = H / 2 + (Math.random() - 0.5) * 100;
      }
      this.life = 1;
    }
  }

  draw(intensity) {
    const alpha = this.life * intensity * 0.8;
    ctx.fillStyle = intensity > 0.5 ? `rgba(255, 255, 255, ${alpha})` : `rgba(200, 200, 200, ${alpha})`;
    ctx.fillRect(this.x, this.y, this.size * intensity, this.size * intensity);
  }
}

for (let i = 0; i < 500; i++) {
  particles.push(new ChaosParticle());
}

startBtn.addEventListener('click', async () => {
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const source = audioContext.createMediaStreamSource(stream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    
    const bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    
    isListening = true;
    overlay.classList.add('hidden');
    status.classList.add('visible');
    
    analyze();
  } catch (err) {
    console.error('Error al acceder al micrófono:', err);
    alert('Necesitamos acceso al micrófono para experimentar el silencio. Por favor, permite el acceso y recarga la página.');
  }
});

function analyze() {
  if (!isListening) return;

  analyser.getByteFrequencyData(dataArray);
  
  let sum = 0;
  for (let i = 0; i < dataArray.length; i++) {
    sum += dataArray[i];
  }
  noiseLevel = sum / dataArray.length;
  
  smoothNoise = smoothNoise * 0.85 + noiseLevel * 0.15;
  
  const noisePercent = Math.min((smoothNoise / 100) * 100, 100);
  noiseBar.style.width = noisePercent + '%';
  
  if (smoothNoise < THRESHOLD) {
    if (!silenceStartTime) silenceStartTime = Date.now();
    
    const silenceDuration = Date.now() - silenceStartTime;
    if (silenceDuration > SILENCE_TIME && !revealed) {
      revealed = true;
      revealBeauty();
    }
  } else {
    silenceStartTime = null;
    if (revealed) {
      revealed = false;
      hideBeauty();
    }
  }
  
  requestAnimationFrame(analyze);
}

let revealProgress = 0;
let circles = [];

function revealBeauty() {
  const numCircles = 5;
  circles = [];
  for (let i = 0; i < numCircles; i++) {
    circles.push({
      radius: 0,
      maxRadius: (W * 0.15) * (i + 1),
      speed: 2 + Math.random()
    });
  }
}

function hideBeauty() {
  circles = [];
  revealProgress = 0;
}

function drawBeauty() {
  if (circles.length === 0) return;
  
  revealProgress += 0.02;
  if (revealProgress > 1) revealProgress = 1;
  
  ctx.strokeStyle = `rgba(232, 227, 216, ${0.3 * revealProgress})`;
  ctx.lineWidth = 1;
  
  for (const circle of circles) {
    if (circle.radius < circle.maxRadius) {
      circle.radius += circle.speed;
    }
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, circle.radius, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Aquí aparece solo la palabra Silenzio
  if (revealProgress > 0.5) {
    ctx.fillStyle = `rgba(232, 227, 216, ${(revealProgress - 0.5) * 0.8})`;
    ctx.font = '300 2.5rem "Cormorant Garamond", serif';
    ctx.textAlign = 'center';
    ctx.fillText('Silenzio', W / 2, H / 2 + circles[0].radius + 50);
  }
}

function drawStatic(intensity) {
  const numPixels = Math.floor(intensity * 1000);
  ctx.fillStyle = `rgba(255, 255, 255, ${intensity * 0.4})`;
  for (let i = 0; i < numPixels; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const w = Math.random() * 3 + 1;
    const h = Math.random() * 3 + 1;
    ctx.fillRect(x, y, w, h);
  }
}

function draw() {
  ctx.fillStyle = 'rgba(10, 10, 10, 0.25)';
  ctx.fillRect(0, 0, W, H);
  
  const chaosIntensity = Math.min(smoothNoise / 100, 1);
  
  if (chaosIntensity > 0.2) {
    const shakeX = (Math.random() - 0.5) * chaosIntensity * 30;
    const shakeY = (Math.random() - 0.5) * chaosIntensity * 30;
    canvas.style.transform = `translate(${shakeX}px, ${shakeY}px)`;
    
    glitchOverlay.classList.add('active');
    glitchOverlay.style.opacity = (chaosIntensity - 0.2) * 1.5;
    
    drawStatic(chaosIntensity);
  } else {
    canvas.style.transform = `translate(0, 0)`;
    glitchOverlay.classList.remove('active');
    glitchOverlay.style.opacity = 0;
  }
  
  if (chaosIntensity > 0.05) {
    for (const p of particles) {
      p.update(chaosIntensity);
      p.draw(chaosIntensity);
    }
  }
  
  if (revealed && chaosIntensity < 0.15) {
    drawBeauty();
  }
  
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
